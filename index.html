<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juragan Laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ceria, bersih, sibuk seperti laundry kiloan di pinggir jalan raya
   IDEA: etalase laundry yang dilihat dari atas — kaca jendela, ubin putih, busa sabun, lalu lintas di depan
   PICTURE: dunia isometrik penuh layar; panel melayang di tepi seperti game tycoon seluler
   COLOUR and TYPE: teal air deterjen (dominan), putih busa (pendukung), kuning sabun (aksen); Fredoka + Nunito
   LAYOUT: topbar, panggung penuh dengan rail kiri + panel misi kanan, dok menu di bawah, laci konten naik dari bawah */
:root{color-scheme:light;
  --navy:#142B4A;--bg:light-dark(#e8eef8,#0b1a2e);--bg2:light-dark(#d3e0f2,#10243d);
  --panel:light-dark(#ffffff,#132a47);--panel2:light-dark(#F8FAFC,#0f2340);
  --ink:light-dark(#142B4A,#F8FAFC);--muted:light-dark(#52627c,#a3b5cf);
  --line:light-dark(#dbe4f0,#24406a);--teal:#2563EB;--teal2:light-dark(#2563EB,#38BDF8);
  --sun:#FACC15;--coral:#ef4444;--ok:#16a34a;--glass:light-dark(rgba(248,250,252,.94),rgba(19,42,71,.93))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,sans-serif;overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;letter-spacing:.2px}
a{color:var(--teal2);font-weight:800}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
/* topbar */
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;color:var(--navy);flex-wrap:wrap;position:relative;z-index:6;border-bottom:1px solid #dbe4f0;box-shadow:0 2px 10px rgba(20,43,74,.06)}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:140px}
.brand svg{flex:none}
.brand b{display:block;font:600 19px/1.05 Fredoka,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.brand small{display:block;font-size:12px;opacity:.85;white-space:nowrap}#acctLine{display:none!important}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;border:1px solid #dbe4f0;color:var(--navy);border-radius:999px;padding:5px 11px;font-weight:800;white-space:nowrap;min-height:34px}
button.pill:hover{background:#e0e9f7}
.pill .neg{color:var(--coral)}
.pill svg{flex:none}
.plus{border:0;background:var(--sun);color:#422006;border-radius:999px;width:24px;height:24px;font-weight:800;line-height:1;padding:0}
.ic{display:inline-block;width:16px;height:16px;flex:none;vertical-align:-3px}
.ic.gem{background:linear-gradient(135deg,#bff2ff,#2bb8e8 55%,#0b78a8);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.tag{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--ok);color:#fff}
.tag.shut{background:var(--coral)}
.tag.ph-pagi{background:#d97706}.tag.ph-siang{background:#0891b2}.tag.ph-sore{background:#ea580c}.tag.ph-malam{background:#4f46e5}
.bar{display:inline-block;width:64px;height:7px;border-radius:9px;background:#dbe4f0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:9px}
.speed{display:flex;background:#eef3fb;border-radius:999px;padding:3px}
.speed button{border:0;background:none;color:var(--navy);border-radius:999px;min-width:42px;height:30px;font-weight:800;font-size:13px}
.speed button.on{background:var(--teal);color:#fff}
.hbtn{border:1px solid #dbe4f0;background:#eef3fb;color:var(--navy);border-radius:12px;width:42px;height:38px;display:grid;place-items:center;flex:none}
.hbtn:hover{background:#e0e9f7}
.hbtn[aria-pressed=false] .w{display:none}.hbtn[aria-pressed=true] .x{display:none}
.hright{display:flex;align-items:center;gap:6px;margin-left:auto}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95;max-width:170px}
@media (max-width:1560px){.sync span{display:none}.sync{padding:0 4px}}
@media (max-width:1250px){.brand{order:1}.hright{order:2}.stats{order:3}.speed{order:4}.brand{margin-right:0}}
.sync i{width:9px;height:9px;border-radius:50%;background:#9ad;flex:none}
.sync i.cloud{background:#7ef0a8}.sync i.saving{background:var(--sun)}.sync i.error{background:var(--coral)}
/* menu hamburger */
.menu{position:absolute;right:8px;top:calc(100% + 6px);width:300px;max-height:calc(100dvh - 90px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,30,35,.3);padding:6px;z-index:20}
.mi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:800;min-height:44px}
.mi:hover{background:var(--panel2)}
.mi .chev{transition:transform .15s}.mi[aria-expanded=true] .chev{transform:rotate(90deg)}
.mi.bad{color:var(--coral)}
.sub{padding:2px 0 6px 12px;border-left:2px solid var(--line);margin:0 0 4px 14px}
.sub .mi{font-weight:700;min-height:40px;padding:8px 10px}
.sub .rowv{padding:6px 10px}
.msep{height:1px;background:var(--line);margin:6px 4px}
/* panggung */
.stage{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2));touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.build canvas,.stage.move canvas{cursor:crosshair}.stage.sell canvas{cursor:not-allowed}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:9;pointer-events:none;width:min(420px,70%)}
.toast{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 8px 24px rgba(0,40,45,.18);animation:pop .25s ease-out}
.toast.good{border-color:var(--ok)}.toast.bad{border-color:var(--coral)}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast,.drawer{animation:none!important}}
/* rail kiri */
.rail{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:4}
.rb{position:relative;width:74px;border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:9px 4px 7px;display:grid;justify-items:center;gap:3px;font-weight:800;font-size:11.5px;line-height:1.1;box-shadow:0 6px 18px rgba(0,40,45,.14);color:var(--ink);position:relative}
.rb img,.db img{display:block;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(20,43,74,.18))}
.rb svg{color:var(--teal2)}
.rb.on{outline:3px solid var(--sun)}
.rb.gem svg{color:#1596c7}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--panel)}
/* panel misi kanan */
.rcol{position:absolute;right:10px;top:12px;width:280px;max-height:calc(100% - 200px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;z-index:4}
.resc{display:grid;gap:5px;padding:9px 12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,40,45,.16);text-align:left;width:100%;color:var(--ink)}
.resc .rh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#2563EB;text-transform:uppercase;letter-spacing:.04em}
.resc b{font-size:14px}.resc small{font-size:12px;color:var(--muted,#64748b)}
.resc .pb{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.resc .pb i{display:block;height:100%;background:linear-gradient(90deg,#2563EB,#38BDF8);border-radius:99px}
.wxc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,40,45,.16);text-align:left;width:100%;color:var(--ink)}
.wxc .wi{color:var(--teal2);display:grid}.wxc .wi.hot{color:#e8890c}.wxc b{display:block;font:600 16px Fredoka,sans-serif}.wxc small{display:block;color:var(--muted);font-size:12px;line-height:1.3}.wxc>b{font:800 16px Nunito,sans-serif}
.alerts{position:absolute;left:10px;top:12px;display:grid;gap:6px;width:min(240px,calc(100% - 320px));z-index:4}
.al{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--coral);border-left:5px solid var(--coral);border-radius:12px;padding:7px 8px 7px 10px;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px rgba(0,40,45,.15)}
.al .btn{min-height:30px;padding:0 9px;font-size:12px;flex:none}
.needs{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:12px}
.needs .meter{height:7px}
.tasks{display:flex;gap:4px;flex-wrap:wrap}.tasks .toggle{min-height:28px;padding:0 9px;font-size:12px}
.mis{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,40,45,.16);z-index:4;overflow:hidden}
.mis.closed{grid-template-rows:auto 0fr}
.mis-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:0;background:none;width:100%;text-align:left;min-height:44px}
.mis-h b{font:600 17px Fredoka,sans-serif;margin-right:auto}
.badge{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px}
.mis-b{overflow-y:auto;padding:0 10px 12px}
.mtabs{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.mtabs button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:0 8px;min-height:32px;font-weight:800;font-size:12.5px;position:relative}
.mtabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mtabs .dot{top:-2px;right:-2px;width:8px;height:8px}
.ms{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;display:grid;gap:5px;margin-bottom:6px}
.ms.done{border-color:var(--ok)}
.ms .t{font-weight:800;font-size:13.5px;line-height:1.25}
.ms .r{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
/* dok bawah */
.dock{display:flex;justify-content:center;gap:2px;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6;overflow-x:auto;scrollbar-width:none}
.db{flex:0 1 92px;min-width:50px;border:0;background:none;border-radius:12px;padding:4px 2px 4px;display:grid;justify-items:center;gap:3px;font-weight:800;font-size:12px;color:var(--muted);position:relative}
.db svg{color:var(--teal2)}
.db:hover{background:var(--panel2)}
.db.on{background:var(--teal);color:#fff}.db.on img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 1px 3px rgba(0,0,0,.35))}.db.on svg{color:#fff}
/* laci */
.drawer{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(800px,100%);max-height:min(66%,620px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,30,35,.25);z-index:8;display:grid;grid-template-rows:auto minmax(0,1fr);animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:.4}}
.drawer header{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:21px;margin-right:auto}
.x{border:1px solid var(--line);background:var(--panel2);border-radius:12px;width:40px;height:40px;font-size:20px;font-weight:800;line-height:1}
.panel{overflow-y:auto;padding:12px 18px 24px}
.panel h3{font-size:16px;margin:16px 0 8px}
.panel h3:first-child{margin-top:4px}
.note{font-size:13px;color:var(--muted);margin:4px 0 10px}
/* elemen umum */
.buildbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:center;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:94%}
.buildbar span{font-weight:700}
.buildbar button{border:0;background:var(--sun);color:#422006;border-radius:10px;min-height:40px;padding:0 14px;font-weight:800;white-space:nowrap}
.buildbar button.alt{background:rgba(255,255,255,.16);color:inherit}
.zoom{position:absolute;right:10px;bottom:14px;display:grid;gap:6px;z-index:3}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-weight:800;font-size:18px}
.inspect{position:absolute;left:92px;bottom:14px;width:min(330px,calc(100% - 160px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;z-index:5;box-shadow:0 10px 30px rgba(0,40,45,.2)}
.inspect h3{margin:0 0 4px;font-size:17px}
.inspect p{margin:2px 0;color:var(--muted);font-size:14px}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--teal2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;min-height:40px;padding:0 13px;font-weight:800;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sun{background:var(--sun);border-color:#eab308;color:#422006}
.btn.bad{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.ico{width:36px;padding:0;min-height:36px;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.wsw{display:inline-flex;align-items:center;gap:6px}.chip.wsw i{width:14px;height:14px;border-radius:4px;border:2px solid;display:inline-block}
.tiers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}.tstep{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);opacity:.55}
.tstep span{font-size:20px}.tstep small{font-size:10.5px;font-weight:800;text-align:center;line-height:1.1}.tstep.done{opacity:.85;border-color:var(--ok)}.tstep.on{opacity:1;border-color:#2563EB;box-shadow:inset 0 0 0 2px #2563EB;background:#eff6ff}
.reqs{display:grid;gap:3px;margin-top:6px}.rq{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 8px;border-radius:8px;background:#fff7ed;color:#9a3412}.rq.ok{background:#f0fdf4;color:#166534}
.tiertag{display:inline-block;font:800 10.5px Nunito,sans-serif;background:#FACC15;color:#142B4A;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;cursor:pointer}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.flags span{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:1px 7px;background:#fff}
.shiftrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0}.shiftrow>span{font-size:12px;font-weight:800;color:#475569;margin-right:2px}.shiftrow select{font:700 12px Nunito,sans-serif;border:1px solid #cbd5e1;border-radius:999px;padding:3px 8px;background:#fff}
.rv .stars{color:#f59e0b;letter-spacing:1px}.rv .stars i{color:#d1d5db;font-style:normal}.rv .reply{background:#f1f5f9;border-radius:10px;padding:6px 9px;font-size:12.5px;margin-top:4px}
#visitBar{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:40;background:#142B4A;color:#fff;border-radius:14px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;max-width:94vw;flex-wrap:wrap;justify-content:center}
#visitBar b{color:#FACC15}body.visiting #mis,body.visiting .rail{opacity:.35;pointer-events:none}body.visiting #dock{opacity:.35;pointer-events:none}.lb .v .vbtn{margin-left:8px;padding:2px 8px;font-size:11px}.tourc{border-color:#FACC15;background:#fffbeb}
/* menu mesin */
.msum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 4px}.msum>div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.msum span{display:grid;font-size:11.5px;color:#64748b;line-height:1.2}.msum span b{font-size:15px;color:var(--ink)}.msum .big{font:900 26px Nunito,sans-serif;color:#94a3b8;min-width:28px;text-align:center}
.msum .warn .big{color:#f59e0b}.msum .bad .big{color:#ef4444}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.mc{display:grid;grid-template-columns:76px 1fr 52px;grid-template-rows:auto auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-left:4px solid #cbd5e1;border-radius:14px;padding:8px 10px;background:#fff}
.mc.run{border-left-color:#2563EB}.mc.wait{border-left-color:#f59e0b}.mc.bad{border-left-color:#ef4444;background:#fff7f7}.mc.dark{border-left-color:#334155}
.mimg{grid-row:1/3;border:0;background:#f1f5f9;border-radius:12px;padding:2px;cursor:pointer;width:76px;height:64px;display:grid;place-items:center}.mimg img{width:72px;height:58px;object-fit:contain}.mimg:hover{background:#e2e8f0}
.mbody{min-width:0}.mtop{display:flex;justify-content:space-between;align-items:center;gap:6px}.mtop b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mst{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap;background:#f1f5f9;color:#475569}.mst.run{background:#dbeafe;color:#1d4ed8}.mst.wait{background:#fef3c7;color:#92400e}.mst.bad{background:#fee2e2;color:#b91c1c}.mst.dark{background:#1f2937;color:#fde047}
.mjob{display:flex;justify-content:space-between;font-size:11.5px;color:#475569;margin-top:3px}.mjob.idle{color:#94a3b8}
.mbar{height:6px;border-radius:99px;background:#e5e7eb;margin-top:4px;overflow:hidden}.mbar i{display:block;height:100%;background:#2563EB;border-radius:99px}
.mcond{grid-row:1/3;grid-column:3;position:relative;display:grid;place-items:center;width:52px}.mcond b{position:absolute;top:12px;font-size:12px}.mcond small{font-size:9.5px;color:#64748b;margin-top:-2px}
.mact{grid-column:2/4}.mact:empty{display:none}.mact .btn{margin-top:4px}
h3 .cnt{font-size:11px;background:#e2e8f0;border-radius:999px;padding:1px 7px;color:#475569;vertical-align:2px}
/* kontrak */
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.kstats>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid}.kstats b{font:900 20px Nunito,sans-serif}.kstats span{font-size:11.5px;color:#64748b}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.kcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.kcard.offer{border-color:#93c5fd;background:#f8fbff}.kcard.past{opacity:.7}
.khead{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}.khead small{display:block;color:#64748b;font-size:11.5px;line-height:1.3}
.kava{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:900 14px Nunito,sans-serif;color:#1e293b}
.kst{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px}.kst.on{background:#dcfce7;color:#166534}.kst.ok{background:#e0f2fe;color:#075985}.kst.bad{background:#fee2e2;color:#b91c1c}

.lb .r{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:12px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line)}
.lb .r.me{border-color:var(--sun);box-shadow:inset 4px 0 0 var(--sun)}
.lb .n{font:700 16px Fredoka,sans-serif;text-align:center}
.lb .r small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .r b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.toggle{border:1px solid var(--line);border-radius:999px;min-height:32px;padding:0 12px;font-weight:800;font-size:12.5px;background:var(--panel2)}
.toggle.on{background:var(--ok);border-color:var(--ok);color:#fff}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel2);margin-top:10px}
summary{font-weight:800;cursor:pointer;min-height:30px}
.ol{padding-left:20px;margin:6px 0;font-size:14px}.ol li{margin:6px 0}
textarea,input[type=text],input[type=number],select{width:100%;font:16px Nunito,sans-serif;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel2);color:var(--ink);min-height:42px}
textarea{min-height:90px;font-size:13px}
.fld{display:grid;gap:4px;font-weight:800;font-size:13px;flex:1 1 120px}
input[type=range]{width:100%;accent-color:var(--teal)}
.modal{position:fixed;inset:0;background:rgba(5,30,34,.55);display:grid;place-items:center;z-index:30;padding:16px}
.sheet{background:var(--panel);color:var(--ink);border-radius:20px;max-width:470px;width:100%;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:90dvh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:24px;line-height:1.1}
.sheet p{margin:6px 0}
.mAct{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 18px Fredoka,sans-serif;color:var(--teal2);z-index:1}
@media (max-width:900px){.sync{display:none}.rcol{width:250px}.alerts{width:200px}}
@media (max-width:600px){
  .hud{gap:5px;padding:6px 8px}.brand{min-width:0;flex:1 1 120px}.brand small{display:none}.brand b{font-size:16px}
  .pill{padding:3px 7px;min-height:28px;font-size:12.5px;gap:4px}.pill.lvl .bar{width:30px}.rcol{max-height:60%}.wxc{padding:7px 9px}.wxc small{display:none}.alerts{top:8px;left:6px;width:min(200px,calc(100% - 280px))}
  .speed{padding:2px}.speed button{min-width:34px;height:26px;font-size:12px}.hbtn{height:32px;width:36px}
  .rail{left:6px;gap:6px}.rb{width:60px;padding:6px 2px 5px;font-size:10.5px;border-radius:13px}.rb img{width:30px;height:30px}
  .rcol{right:6px;top:8px;width:min(250px,calc(100% - 80px))}
  .dock{gap:0;padding-inline:2px}.db{font-size:10px;padding:5px 0 4px;min-width:0;flex:1 1 0}.db img{width:30px;height:30px}.rb img{width:30px;height:30px}.rb{width:60px}

  .buildbar{left:6px;right:6px;transform:none;flex-wrap:wrap}.buildbar span{font-size:13px;flex:1 1 100%}

  .menu{right:4px;width:calc(100vw - 8px)}
}

function rollTraits(){const pos=Object.keys(TRAITS).filter(k=>TRAITS[k].pos),neg=Object.keys(TRAITS).filter(k=>!TRAITS[k].pos),out=[];
  const r1=Math.random(),r2=Math.random();let np=r1<.25?0:r1<.82?1:2,nn=r2<.35?0:r2<.88?1:2;if(!np&&!nn)Math.random()<.5?np=1:nn=1;
  const add=(list,n)=>{for(let i=0;i<n;i++){const c=list.filter(k=>!out.includes(k)&&!out.includes(TRAIT_X[k]));if(c.length)out.push(pick(c))}};
  add(pos,np);add(neg,nn);return out.slice(0,3)}

  const at={spd:r(),skl:r(),sta:r(),dis:r(),loy:Math.round(rnd(3,5)*10)/10};
  const m={gesit:['spd',1.2],teliti:['skl',1],tangguh:['sta',1.2],rajin:['dis',1.2],malas:['dis',-1.2],ceroboh:['skl',-.8],bersih:['dis',.5]};
  for(const k of t)if(m[k])at[m[k][0]]=clamp(Math.round((at[m[k][0]]+m[k][1])*10)/10,1,10);return at}
const staffLvl=s=>1+Math.floor(Math.sqrt((s.xp||0)/12));

  if(now>before){s.sp=(s.sp||0)+(now-before);const main=roleOf(s).main||'skl';s.at=s.at||rollAttrs(s.type,s.traits);
    s.at[main]=clamp(Math.round((s.at[main]+.5)*10)/10,1,10);s.at.skl=clamp(Math.round((s.at.skl+.3)*10)/10,1,10);s.at.loy=clamp(Math.round((s.at.loy+.2)*10)/10,1,10);

function recipeFor(key){S.rcp=S.rcp||{};const req=SVC_CHEM[key]||{};const r=S.rcp[key]=S.rcp[key]||{};
  for(const [cat,lv] of Object.entries(req)){if(r[cat]&&!chemOk(r[cat]))r[cat]=null;
    if(r[cat]===undefined||(lv===2&&!r[cat])){const opts=Object.keys(CHEM).filter(k=>CHEM[k].cat===cat&&chemOk(k));if(lv===2||r[cat]===undefined)r[cat]=lv===2&&opts.length?opts.sort((a,b)=>perKg(a)-perKg(b))[0]:null}}
  return r}
function doseWaste(s,it){const d=it?ITEMS[it.type]:{};return clamp(1.18-(s?attr(s,'skl'):5)*.015-(d.q||0)*.05,.9,1.2)}
function chemNeed(o,s,it){const r=recipeFor(rcpKey(o)),need={},req=SVC_CHEM[rcpKey(o)]||{},w=doseWaste(s,it);let miss=null;
  for(const [cat,lv] of Object.entries(req)){const k=r[cat];if(!k){if(lv===2&&Object.keys(CHEM).some(x=>CHEM[x].cat===cat&&chemOk(x)))miss=cat;continue}need[k]=Math.ceil(o.kg*CHEM[k].dose*w)}
  return {need,miss}}

const bulkDisc=ml=>{for(const [m,d] of BULK)if(ml>=m)return d;return 0};
function whCap(){return S.items.filter(i=>ITEMS[i.type].kind==='supply').reduce((a,i)=>a+(ITEMS[i.type].cap||30)*1000,0)}
const whUsed=()=>Object.entries(S.chem||{}).filter(([k])=>isLiquid(k)).reduce((a,[,v])=>a+v,0);
const whPending=()=>(S.deliveries||[]).reduce((a,d)=>a+Object.entries(d.items).filter(([k])=>isLiquid(k)).reduce((x,[,v])=>x+v,0),0);
function supOk(sp,k){const S2=SUPPLIERS[sp];return tierOk(S2.tier)&&(S2.maxTier==null||CHEM[k].tier<=S2.maxTier)}
function cartCalc(){const sp=SUPPLIERS[S.cartSup]||SUPPLIERS.agen,items=Object.entries(S.cart||{}).filter(([,v])=>v>0);
  const ml=items.filter(([k])=>isLiquid(k)).reduce((a,[,v])=>a+v,0),sub=items.reduce((a,[k,v])=>a+chemPrice(k,S.cartSup)*(isLiquid(k)?v/1000:v),0),disc=Math.round(sub*bulkDisc(ml)),fee=items.length?sp.fee:0;
  const bad=items.filter(([k])=>!supOk(S.cartSup,k)).map(([k])=>CHEM[k].name);
  return {items,ml,sub:Math.round(sub),disc,fee,total:Math.round(sub-disc+fee),bad,sp}}
function arriveLabel(sp){return sp.days===0?'±1 jam (dibelikan karyawan)':sp.days===1?'besok pagi':sp.days+' hari lagi'}
function placeOrder(auto){const c=cartCalc();if(!c.items.length)return false;
  if(c.bad.length){if(!auto)toast(`${c.sp.name} tidak menjual: ${c.bad.join(', ')}`,'bad');return false}
  if(c.total<c.sp.min){if(!auto)toast(`Minimal belanja di ${c.sp.name} ${rp(c.sp.min)}`,'bad');return false}
  if(whUsed()+whPending()+c.ml>whCap()){if(!auto)toast(`Gudang tidak muat (kapasitas ${fmtL(whCap())}). Tambah rak atau gudang bahan di Toko.`,'bad');return false}
  if(!Economy.spend('coin',c.total,`Belanja bahan di ${c.sp.name}`)){if(!auto)toast('Kas tidak cukup','bad');return false}
  S.today.sup=(S.today.sup||0)+c.total;const late=Math.random()<(5-c.sp.rep)*.12&&c.sp.days>0;
  const d={id:'d'+uid(),sup:S.cartSup,items:Object.fromEntries(c.items),day:S.clock.day+c.sp.days+(late?1:0),min:(S.hours.open+1)*60,errand:c.sp.days===0,created:S.clock.run,status:'wait',late};
  S.deliveries.push(d);S.cart={};Sfx.play('cash');if(!auto)toast(`Pesanan ke ${c.sp.name} dibuat — tiba ${arriveLabel(c.sp)}`,'good');renderPanel();return true}

const Saves={status:'idle',lastAt:0,writing:false,pending:false,dirty:false,retryT:null,tries:0,
  key(){return 'jl.save.'+Auth.account.id},
  ref(){if(!Auth.online())return null;try{return Platform.db.collection('data/users/'+Auth.account.id).doc('save')}catch(e){return null}},
  async load(){
    let local=null,cloud=null,ws=null;
    try{const t=Local.get(this.key());if(t)local=JSON.parse(t)}catch(e){}
    const ref=this.ref();
    if(Auth.google()&&Api.token){try{const j=await Api.get('/api/save');if(j&&typeof j.blob==='string')cloud=JSON.parse(j.blob);ws=j&&j.wallet;this.setStatus('cloud')}catch(e){this.setStatus('error')}}
    else if(ref){try{const snap=await withTimeout(ref.get(),10000);if(snap.exists){const d=snap.data();if(d&&typeof d.blob==='string')cloud=JSON.parse(d.blob)}this.setStatus('cloud')}catch(e){this.setStatus('error')}}
    let s=local;if(cloud&&(!local||(cloud.savedAt||0)>=(local.savedAt||0)))s=cloud;
    s=s?migrate(s):null;
    if(s&&ws){s.wallet={coin:Math.round(ws.coin)||0,gem:Math.round(ws.gem)||0};s.walletSeq=ws.seq||0;s.walletVer=ws.version||0;s._wsync={...s.wallet}}
    return s;
  },
  async save(){if(R.visit||!S)return;
    S.savedAt=Date.now();const blob=JSON.stringify(S,strip);
    Local.set(this.key(),blob);
    const ref=this.ref(),g=Auth.google()&&!!Api.token;
    if(!ref&&!g){this.dirty=false;this.setStatus('local');return}
    if(this.writing){this.pending=true;this.dirty=true;return}
    this.writing=true;this.setStatus('saving');
    let ok=false,conflict=false;
    try{
      if(g){
        // Dompet server sumber kebenaran: kirim usulan perubahan, lalu pakai saldo hasilnya.
        const seq=(S.walletSeq||0)+1;
        let w=null;
        try{w=await Api.post('/api/wallet/sync',{coin:Math.round(S.wallet.coin)||0,gem:Math.round(S.wallet.gem)||0,seq,ver:S.walletVer||0})}
        catch(err){if(err&&err.status===409)w=await Api.get('/api/wallet');else throw err}
        if(w&&w.wallet){
          S.wallet.coin=Math.round(w.wallet.coin)||0;S.wallet.gem=Math.round(w.wallet.gem)||0;
          S.walletSeq=w.wallet.seq||0;S.walletVer=w.wallet.version||0;S._wsync={...S.wallet};
          Local.set(this.key(),JSON.stringify(S,strip));
        }
        await Api.put('/api/save',{blob:JSON.stringify(S,strip),savedAt:S.savedAt,v:S.v});
      }
      else await ref.set({v:S.v,savedAt:S.savedAt,blob});
      ok=true;
    }catch(e){conflict=!!(e&&e.status===409);this.setStatus(conflict?'conflict':'error')}
    this.writing=false;
    if(ok){this.dirty=false;this.tries=0;this.lastAt=Date.now();if(this.retryT){clearTimeout(this.retryT);this.retryT=null}this.setStatus('cloud')}
    else{this.dirty=true;this.scheduleRetry(conflict)}
    if(this.pending){this.pending=false;this.save()}
  },
  scheduleRetry(conflict){
    if(this.retryT)return;
    const wait=Math.min(30000,1000*Math.pow(1.8,Math.min(this.tries++,6)));
    this.retryT=setTimeout(async()=>{
      this.retryT=null;
      if(conflict&&await this.resolveConflict())return;
      if(this.dirty)this.save();
    },wait);
  },
  async resolveConflict(){
    if(R.visit||!Auth.google()||!Api.token)return false;
    try{
      const j=await Api.get('/api/save');
      if(j&&typeof j.blob==='string'){
        const cloud=JSON.parse(j.blob);
        if((cloud.savedAt||0)>(S.savedAt||0)){
          loadState(migrate(cloud));this.dirty=false;this.setStatus('conflict');
          toast('Progres dari perangkat lain lebih baru dan sudah dimuat','bad');return true;
        }
        await Api.put('/api/save',{blob:JSON.stringify(S,strip),savedAt:S.savedAt,v:S.v,force:true});
        this.dirty=false;this.setStatus('cloud');return true;
      }
    }catch(e){}
    return false;
  },
  setStatus(st){this.status=st;Bus.emit('sync')}};

const Economy={
  apply(c,delta,reason,key,log=true){

    Saves.dirty=true;return true;
  },
  spend(c,n,reason){if(S.wallet[c]<n)return false;return this.apply(c,-n,reason)},

function canPlace(type,x,y,rot,ignoreId){

  const d={x:w-1,y:Math.floor(h/2)};if(x===d.x&&y===d.y)return 'Pintu masuk harus kosong';
  const others=S.items.filter(i=>i.id!==ignoreId);
  if(others.some(i=>i.x===x&&i.y===y&&!!ITEMS[i.type].mount===!!def.mount&&ITEMS[i.type].kind!=='trolley'))return 'Petak sudah terisi';
  if(def.kind==='trolley'&&others.some(i=>i.x===x&&i.y===y))return 'Petak sudah terisi';
  if(def.edge)return 'Dinding dipasang di garis antar-petak';
  if(def.mount&&!mountSide(x,y))return 'Harus menempel dinding (dinding belakang atau dinding dalam)';
  if(def.mount&&others.some(o=>ITEMS[o.type].mount&&o.x===x&&o.y===y))return 'Petak sudah terisi';
  if(!ignoreId){if(!tierOk(def.tier))return `Terbuka di tahap ${TIERS[def.tier].name}`;if(S.lvl<def.lvl)return `Butuh level ${def.lvl}`;
    if(def.max&&S.items.filter(i=>i.type===type).length>=def.max)return 'Sudah mencapai batas';
    const c=def.cur||'coin';if(S.wallet[c]<payNow(def))return c==='gem'?'Diamond tidak cukup':'Kas tidak cukup';
    if(payNow(def)<def.price&&debtLeft()+def.price*(1-CICIL.dp)*(1+CICIL.markup)>creditLimit())return 'Plafon cicilan tidak cukup'}
  const keep=S.items,before=R.nav.pockets;
  const tmp={id:ignoreId||'tmp',type,x,y,rot,busy:null};S.items=others.concat([tmp]);const nav=rebuildNav();S.items=keep;
  if(needsAccess(tmp)&&!nav.access[tmp.id])return 'Bagian depan harus menghadap lantai kosong — tekan R untuk memutar';
  if(others.filter(needsAccess).some(i=>!nav.access[i.id]))return 'Akan menghalangi bagian depan mesin atau stasiun lain';
  if(nav.pockets>before)return 'Akan menutup area — sisakan celah atau pasang pintu';

  return '';
}

    g.globalAlpha=vis;g.fillStyle=warm?'#ffb35c':'#ffe066';circ(s.x,s.y,r);g.globalAlpha=1}

    g.globalAlpha=vis;g.fillStyle='#f3f1dc';circ(m.x,m.y,r);g.fillStyle=rgb(skyAt(h)[0]);circ(m.x+r*.45,m.y-r*.25,r*.85);g.globalAlpha=1}
  if(!R.clouds)R.clouds=Array.from({length:8},(_,i)=>({x:Math.random(),y:.04+Math.random()*.22,s:.6+Math.random()*.8,v:.004+Math.random()*.006}));
  const nC=wx.rain?8:wx.icon==='cloud'?7:wx.name==='Panas terik'?1:3,dark=night>0?.45:0;
  R.clouds.forEach((c,i)=>{if(i>=nC)return;c.x+=c.v*(1/60);if(c.x>1.15)c.x=-.15;const x=c.x*CW,y=c.y*CH,k=c.s*Math.min(1.2,CW/1100);

  openModal(`Laporan hari ke-${r.day}`,`<div class="rp">
    <div class="rp-hd"><div><small>LAPORAN HARIAN</small><b>${esc(S.profile.shop)}</b><span>Hari ke-${r.day} · buka ${r.hours||12} jam, tutup ${hh2(r.close||20)} · ${TIERS[S.tier||0].name}</span></div><img src="assets/icons/laporan.png" alt="" width="48" height="48"></div>

      <div><small>Pemasukan</small><b>${rp(omzet)}</b><span>${r.served} cucian diambil</span></div>
      <div><small>Pesanan masuk</small><b>${r.orders}</b><span>${r.lost?r.lost+' pergi':'tidak ada yang pergi'}</span></div>

  else if(why)toast(why,'bad');R.wallPrev=null;
  if(S.wallet.coin<wallPrice()){R.build=null;modeUI()}}
const wallPrice=()=>wst({st:R.wallStyle}).price;
function paintWall(e){const ex=e&&e.dist<.25&&wallAt(e);if(!ex)return false;const ns=R.wallStyle||'putih';if((ex.st||'putih')===ns){toast('Dinding sudah bergaya '+wst(ex).name);return true}
  const cost=Math.round(wst({st:ns}).price*.4/1000)*1000;if(S.wallet.coin<cost){toast('Kas tidak cukup','bad');return true}
  const old=ex.st;ex.st=ns;R.nav=rebuildNav();const m=mountProblem();if(m){ex.st=old;R.nav=rebuildNav();toast('Dinding kaca tidak bisa ditempeli barang: '+m.toLowerCase(),'bad');return true}
  Economy.spend('coin',cost,`Mengganti dinding menjadi ${wst(ex).name.toLowerCase()}`);Sfx.play('place');Saves.dirty=true;return true}
function placeDoor(e){if(!e||!edgeValid(e)){toast('Pilih garis di dalam lahan','bad');return}
  const ex=wallAt(e);if(ex&&ex.door){toast('Sudah ada pintu di sini','bad');return}
  if(S.wallet.coin<ITEMS.idoor.price){toast('Kas tidak cukup','bad');return}
  if(ex){ex.door=true;R.nav=rebuildNav();const m=mountProblem();if(m){ex.door=false;R.nav=rebuildNav();toast(m,'bad');return}}
  else S.walls.push({d:e.d,x:e.x,y:e.y,door:true,st:R.wallStyle||'putih'});
  Economy.spend('coin',ITEMS.idoor.price,'Memasang Pintu Dalam');R.nav=rebuildNav();repathAll();Sfx.play('place');Missions.track('build');Saves.dirty=true;toast('Pintu dipasang','good');
  if(S.wallet.coin<ITEMS.idoor.price){R.build=null;modeUI()}}
function removeEdge(e){const ex=wallAt(e);if(!ex)return false;
  S.walls=S.walls.filter(q=>q!==ex);R.nav=rebuildNav();const m=mountProblem();if(m){S.walls.push(ex);R.nav=rebuildNav();toast(m,'bad');return true}
  const ref=Math.floor((ex.door?ITEMS.idoor.price:wst(ex).price)*.5);Economy.grant('coin',ref,ex.door?'Membongkar pintu':'Membongkar dinding');
  repathAll();Sfx.play('sell');Saves.dirty=true;toast(ex.door?'Pintu dibongkar':'Segmen dinding dibongkar');return true}
const edgeMode=()=>R.build==='wall'||R.build==='idoor';
const releasePtr=id=>{try{if(cv.hasPointerCapture(id))cv.releasePointerCapture(id)}catch(e){}};
cv.addEventListener('pointerdown',e=>{if(e.button===2)return;cv.setPointerCapture(e.pointerId);
  if(S&&R.build==='wall'&&e.isPrimary&&ptrs.size===0){const t=toVertex(e.offsetX,e.offsetY);R.wallDrag={a:t,b:t};dragPid=e.pointerId;return}
  if(S&&R.floorMode&&e.isPrimary&&e.button===0&&ptrs.size===0){const t=toTile(e.offsetX,e.offsetY);R.floorDrag={a:t,b:t};dragPid=e.pointerId;return}
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});drag={x:e.offsetX,y:e.offsetY,cx:cam.x,cy:cam.y,moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{
  if(S){R.hover=toTile(e.offsetX,e.offsetY);R.hoverF=toTileF(e.offsetX,e.offsetY)}
  if(R.wallDrag){if(e.pointerId===dragPid)R.wallDrag.b=toVertex(e.offsetX,e.offsetY);return}
  if(R.floorDrag){if(e.pointerId===dragPid)R.floorDrag.b=toTile(e.offsetX,e.offsetY);return}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)cam.z=clamp(cam.z*d/pinch,.35,2.4);pinch=d;drag.moved=true;R.userCam=true;return}
  if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){R.userCam=true;cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z}}});
const endDrag=(e,commit)=>{
  if(!R.wallDrag&&!R.floorDrag)return false;
  if(e.pointerId!==dragPid)return true;
  if(R.floorDrag){R.floorDrag.b=toTile(e.offsetX,e.offsetY);if(commit)paintFloor();R.floorDrag=null}
  else{R.wallDrag.b=toVertex(e.offsetX,e.offsetY);if(commit)placeWallLine();R.wallDrag=null}
  dragPid=null;ptrs.delete(e.pointerId);releasePtr(e.pointerId);return true;
};
cv.addEventListener('pointerup',e=>{if(endDrag(e,true))return;if(!ptrs.has(e.pointerId))return;const wasDrag=drag&&drag.moved;ptrs.delete(e.pointerId);releasePtr(e.pointerId);if(ptrs.size<2)pinch=0;if(ptrs.size)return;drag=null;if(!wasDrag&&S)clickAt(e.offsetX,e.offsetY)});
cv.addEventListener('pointercancel',e=>{if(e.pointerId===dragPid){R.wallDrag=null;R.floorDrag=null;dragPid=null}ptrs.delete(e.pointerId);releasePtr(e.pointerId);drag=null;pinch=0});
cv.addEventListener('pointerleave',()=>{R.hover=null;R.hoverF=null});
cv.addEventListener('wheel',e=>{e.preventDefault();R.userCam=true;const before=toWorld(e.offsetX,e.offsetY);cam.z=clamp(cam.z*(e.deltaY<0?1.1:1/1.1),.35,2.4);const after=toWorld(e.offsetX,e.offsetY);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(R.build||R.move||R.sell)cancelPlacing();else if(R.sel){R.sel=null;renderInspect()}});
function clickAt(sx,sy){
  if(!R.build&&!R.move&&!R.sell){const w=toWorld(sx,sy);let best=null,bd=1;for(const s of S.staff){const r=rt(s);if(r.away)continue;const p=P(r.px+.5,r.py+.5),dx=w.x-p.x,dy=w.y-(p.y-20),d=dx*dx/110+dy*dy/420;if(d<bd){bd=d;best=s}}
    if(best){R.selStaff=best.id;R.sel=null;Sfx.play('click');renderInspect();return}}
  R.selStaff=null;const f=toTileF(sx,sy);
  if(R.build==='idoor'){placeDoor(nearestEdge(f));return}
  if(R.sell){const e=nearestEdge(f);if(e.dist<.2&&wallAt(e)&&removeEdge(e))return}
  if(R.paint){if(!paintWall(nearestEdge(f)))toast('Klik tepat di dinding yang ingin dicat');return}
  clickTile(toTile(sx,sy));
}
function clickTile(t){
  if(R.build==='wall')return;
  if(R.build){if(place(R.build,t.x,t.y,R.rot)){const d=ITEMS[R.build];if(S.wallet[d.cur||'coin']<d.price){R.build=null;modeUI()}}return}
  if(R.move){commitMove(t.x,t.y);return}
  const it=S.items.find(i=>i.x===t.x&&i.y===t.y);
  if(R.sell){if(it)sellItem(it);return}
  R.sel=it?it.id:null;if(it)Sfx.play('click');renderInspect();
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){if(!$('#modal').hidden&&!R.modalLock){closeModal();return}if(!$('#menu').hidden){closeMenu();return}if(R.build||R.move||R.sell){cancelPlacing();return}if(R.view){closeDrawer();return}R.sel=null;renderInspect();return}
  if(!S||!$('#modal').hidden)return;
  if(e.key==='r'||e.key==='R'){if(R.build||R.move)rotPlacing();else if(R.sel){const it=itemById(R.sel);if(it)rotateItem(it)}return}
  const m={' ':S.speed?0:1,'1':1,'2':2,'3':4}[e.key];if(m!==undefined&&speedAllowed()){e.preventDefault();setSpeed(m)}
});

/* --- loop --- */
let last=performance.now(),acc=0,acc2=0,saveT=0,lbT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;T=now/1000;
  if(S){
    if(R.visit){tickStreet(dt)}else if(!R.modalPause&&S.speed>0){const sim=dt*S.speed,n=Math.ceil(sim/.05);for(let i=0;i<n;i++)tick(sim/n);tickStreet(sim);Saves.dirty=true}
    drawWorld(dt);hud();
    acc+=dt;if(acc>.5){acc=0;if(R.view&&LIVE.has(R.view))renderPanel(R.view);if(R.sel)renderInspect()}
    R.sndAcc=(R.sndAcc||0)+dt;if(R.sndAcc>.2){updateSpatialSound(R.sndAcc);R.sndAcc=0}
    acc2+=dt;if(acc2>1){acc2=0;R.cmf=comfortCalc();renderResCard();const live=Sfx.on&&!S.clock.closed&&!R.modalPause;renderMissions();renderAlerts();renderHudWx();if(R.selStaff)renderInspect();Sfx.rain(Sfx.on&&!S.clock.closed?WX[S.wx.now].rain:0)}
    saveT+=dt;if(saveT>CFG.autosaveSec){saveT=0;if(Saves.dirty)Saves.save()}
    lbT+=dt;if(lbT>CFG.lbPushSec){lbT=0;Leaderboard.push()}
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&Saves.dirty)Saves.save()});
window.addEventListener('pagehide',()=>{if(S){S.savedAt=Date.now();Local.set(Saves.key(),JSON.stringify(S,strip))}});

function loadState(s){
  S=s;R.customers=[];R.queue=[];R.srt={};R.peds=[];R.apeds=[];R.cars=[];R.pveh=[];R.kurir=null;R.yard=null;R.sel=null;R.build=null;R.sell=false;R.move=null;
  S.chem=S.chem||{};S.rcp=S.rcp||{};S.deliveries=S.deliveries||[];S.reorder=S.reorder||{};S.cart=S.cart||{};S.cartSup=S.cartSup||'agen';S.mkt=S.mkt||{det:1,pew:1,pel:1,noda:1,san:1};
  for(const d of S.deliveries)if(d.status==='going')d.status='wait';if(S.brand)CHEM.det_brand.name=S.brand.name;
  for(const st of S.staff){st.at=st.at||rollAttrs(st.type,st.traits);st.role=st.role||'umum';st.tasks=st.tasks||allTasks();st.needs=st.needs||freshNeeds();if(st.needs.hygiene==null)st.needs.hygiene=90;st.traits=st.traits||rollTraits()}R.selStaff=null;
  S.walls=S.walls||[];S.upgrades=S.upgrades||{};R.city=null;R.doorAnim={};R.doorOpen=0;
  if(S.notice){const n=S.notice;delete S.notice;setTimeout(()=>toast(n,'good'),2200)}
  S.stock=S.stock||{deterjen:15,pewangi:15,duo:10};S.recipe=S.recipe||'detpew';if(S.autoStock==null)S.autoStock=true;S.today.sup=S.today.sup||0;for(const st of S.staff)st.role=st.role||'umum';
  S.hours=S.hours||{...CFG.defaultHours};S.mis=S.mis||{};S.research=S.research||{done:{},active:null};S.prices=S.prices||{};S.svcOff=S.svcOff||{};S.history=S.history||[];
  if(!S.wx||!S.wx.plan){S.wx={plan:planDay(),now:'cerah',tomorrow:rollWx()};}S.wx.now=wxAt(S.clock.min/60);
  for(const o of S.orders){o._cust=null;if(o.status==='intake'||o.intake){const it=itemById(o.at);if(it&&it.busy===o.id)it.busy=null;o.status='idle';o.at='rack';o.intake=null;o.prog=0}
    if(o.status==='moving'){o.status='idle';if(o.at==='carry')o.at='rack'}
    if(o.at!=='rack'&&o.at!=='carry'&&!itemById(o.at)){o.at='rack';o.status='idle'}
    if(o.status==='processing'){const it=itemById(o.at);if(it&&needsOp(ITEMS[it.type]))o.status='idle'}}
  for(const it of S.items){if(it.busy&&!orderById(it.busy))it.busy=null;it._moving=false}
  for(const it of S.items){if(it.rot!=null)continue;it.rot=0;if(!needsAccess(it))continue;for(let r=0;r<4;r++){it.rot=r;if(rebuildNav().access[it.id])break}}
  R.nav=rebuildNav();
  const ct=counter();if(ct&&!R.nav.cashier){const o=ct.rot||0;for(let r=0;r<4;r++){ct.rot=(o+r)%4;const nv=rebuildNav();if(nv.cashier&&nv.access[ct.id]){R.nav=nv;break}}if(!R.nav.cashier){ct.rot=o;R.nav=rebuildNav()}}
  if(!S.items.some(i=>ITEMS[i.type].kind==='scale')){let done=false;for(let y=0;y<R.nav.h&&!done;y++)for(let x=0;x<R.nav.w&&!done;x++)for(let r=0;r<4&&!done;r++)if(!canPlace('scale_analog',x,y,r,'__auto')){S.items.push({id:'i'+uid(),type:'scale_analog',x,y,rot:r,busy:null});R.nav=rebuildNav();done=true}
    if(done)setTimeout(()=>toast('Timbangan Analog dipasang gratis — kini setiap cucian ditimbang dulu sebelum dicuci','good'),1400)}
  for(const st of S.staff)if(st.tasks&&st.tasks.timbang===undefined)st.tasks.timbang=!!(st.tasks.angkut||st.tasks.kasir);
  if(!S.items.some(i=>ITEMS[i.type].kind==='supply')){let done=false;for(let y=0;y<R.nav.h&&!done;y++)for(let x=0;x<R.nav.w&&!done;x++)for(let r=0;r<4&&!done;r++)if(!canPlace('supply',x,y,r,'__auto')){S.items.push({id:'i'+uid(),type:'supply',x,y,rot:r,busy:null});R.nav=rebuildNav();done=true}
    if(done)setTimeout(()=>toast('Rak Perlengkapan Cuci dipasang gratis — karyawan kini mengambil deterjen sebelum mencuci','good'),600)}
  for(const st of S.staff){if(st.x<0||st.y<0||st.x>=R.nav.w||st.y>=R.nav.h||R.nav.dist[st.y*R.nav.w+st.x]<0){const t=nearestFree(R.nav.door.x,R.nav.door.y);st.x=t.x;st.y=t.y}}

function onboard(){

    const on=Auth.online();
    openModal('Selamat datang, Juragan!',`<p>Bangun usaha laundry kiloan di pinggir jalan raya, dari satu mesin cuci sampai jadi laundry terbesar di kota.</p>

/* Pemasukan saat game ditutup: dihitung dari rata-rata laba harian terakhir, dengan efisiensi lebih rendah dan batas jam */
function offlineCheck(){
  const after=()=>{if(S.clock.closed)showReport()};
  const away=Date.now()-(S.savedAt||Date.now());if(away<10*60000)return;
  const off=S.items.some(i=>i.type==='office'),cap=off?16:has('manajer')?12:8,rate=off?.7:has('manajer')?.6:.4,hours=Math.min(away/3.6e6,cap);
  const nets=(S.history||[]).slice(0,3).map(h=>h.net??0).filter(n=>n>0);
  const avg=nets.length?nets.reduce((a,b)=>a+b,0)/nets.length:0;
  const pay=Math.round(avg*rate*hours/1000)*1000;
  const awayTxt=away>=3.6e6?`${fmt1(away/3.6e6)} jam`:`${Math.round(away/60000)} menit`;
  if(pay<=0){openModal('Selamat datang kembali!',`<p>Kamu pergi selama ${awayTxt}.</p><p class="note">Belum ada pemasukan saat game ditutup karena belum ada riwayat laba harian. Selesaikan beberapa hari dengan laba agar karyawan tetap menghasilkan saat kamu pergi.</p>`,[{label:'Lanjut',cls:'pri',fn:after}],{onDismiss:after});return}
  openModal('Selamat datang kembali!',`<p>Kamu pergi selama <b>${awayTxt}</b>. Karyawan tetap melayani pelanggan dengan tenaga terbatas.</p>
    <div class="kv" style="margin:10px 0"><span>Rata-rata laba harian terakhir</span><span>${rp(avg)}</span><span>Efisiensi saat ditutup</span><span>${Math.round(rate*100)}% per jam</span><span>Jam yang dihitung (maks. ${cap})</span><span>${fmt1(hours)} jam</span><span class="tot">Pemasukan</span><span class="tot good">${rp(pay)}</span></div>
    <p class="note">${has('manajer')?'Riset Manajer Toko aktif.':'Riset Manajer Toko menaikkan efisiensi ke 60% dan batas ke 12 jam.'}</p>`,
    [{label:`Ambil 2× · 10 diamond`,fn:()=>{if(Economy.spend('gem',10,'Gandakan pemasukan saat ditutup')){Economy.grant('coin',pay*2,`Pemasukan saat ditutup (${awayTxt}, 2×)`);Sfx.play('cash')}else{Economy.grant('coin',pay,`Pemasukan saat ditutup (${awayTxt})`);toast('Diamond tidak cukup, diterima 1×','bad')}Saves.save();after()}},
     {label:'Ambil',cls:'pri',fn:()=>{Economy.grant('coin',pay,`Pemasukan saat ditutup (${awayTxt})`);Sfx.play('cash');Saves.save();after()}}],{pause:true,onDismiss:()=>{Economy.grant('coin',pay,`Pemasukan saat ditutup (${awayTxt})`);Saves.save();after()}});
}
async function boot(){
  resize();syncSnd();
  const pr=prefs();R.bubbles=pr.bubbles!==false;R.nameTags=pr.nameTags!==false;R.showZones=pr.showZones!==false;setMisOpen(pr.mis!=null?pr.mis:window.innerWidth>700,false);
  await Platform.init();await Auth.init();syncUI();await Balance.load();
  const s=await Saves.load();
  $('#loading').remove();
  if(s){loadState(s);offlineCheck()}
  else{const name=await onboard();R.modalLock=false;loadState(newState(name));Saves.save();toast('Kamu memulai sebagai Laundry Rumahan. Kumpulkan pelanggan, lalu lihat syarat naik kelas di menu Ekspansi.','good')}
  if(!Auth.online())Saves.setStatus('local');
  Shop.init();Credits.init().then(()=>renderPanel());
  Leaderboard.push();
  if(Auth.google()){Friends.refresh();setInterval(()=>Friends.refresh(),60000);
    const inv=new URLSearchParams(location.search).get('teman');
    if(inv&&inv.toUpperCase()!==Credits.code){history.replaceState(null,'',location.pathname);setTimeout(()=>openModal('Undangan teman',`<p>Tambahkan <b>${esc(inv.toUpperCase())}</b> sebagai teman? Kalian akan saling muncul di peringkat teman.</p>`,[{label:'Nanti'},{label:'Tambah teman',cls:'pri',fn:()=>Friends.add(inv)}]),1200)}}
  Balance.notify();
  requestAnimationFrame(frame);
}

}
